<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Painel de Preços</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__brand">
    <span class="topbar__title">Painel de Preços</span>
    <span class="topbar__crumbs">/ Reparações</span>
  </div>
  <div class="topbar__actions">
    <span id="gerado-em" class="topbar__clock"></span>
  </div>
</header>

<nav class="tabs">
  <a href="index.html" class="active">Preços</a>
  <a href="historico.html">Histórico</a>
</nav>

<main class="container">
  <div class="search-box">
    <label for="busca">Pesquisar (marca, modelo, serviço ou qualidade)</label>
    <input type="text" id="busca" placeholder="ex: ecrã iphone 16, bateria samsung, original..." autocomplete="off" />

    <div class="filters-row">
      <select id="filtro-marca"><option value="">Todas as marcas</option></select>
      <select id="filtro-modelo"><option value="">Todos os modelos</option></select>
    </div>
  </div>

  <div id="contagem" class="result-count"></div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Marca</th>
          <th>Modelo</th>
          <th>Serviço</th>
          <th>Qualidade</th>
          <th class="num">Preço</th>
        </tr>
      </thead>
      <tbody id="corpo-tabela">
        <tr><td colspan="5"><div class="empty-state">A carregar…</div></td></tr>
      </tbody>
    </table>
  </div>
</main>

<script src="assets/shared.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
